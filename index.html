<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Style-BERT-VITS2 音声合成プレイヤー</title>
  <!-- 量子化・通常演算子を網羅したフル版 ONNX Runtime Web -->
  <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.17.1/dist/ort.all.min.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      max-width: 720px;
      margin: 40px auto;
      padding: 0 20px;
      line-height: 1.6;
      color: #333;
      background-color: #fcfcfc;
    }
    h1 {
      font-size: 1.5rem;
      border-bottom: 2px solid #eaeaea;
      padding-bottom: 10px;
    }
    .notice {
      background-color: #fffbeb;
      border-left: 4px solid #f59e0b;
      padding: 12px 16px;
      margin: 16px 0;
      font-size: 0.9rem;
      color: #92400e;
    }
    .notice ul {
      margin: 6px 0 0 0;
      padding-left: 20px;
    }
    .form-group {
      margin: 20px 0;
    }
    label {
      display: block;
      font-weight: 600;
      margin-bottom: 6px;
      font-size: 0.95rem;
    }
    textarea {
      width: 100%;
      box-sizing: border-box;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #cbd5e1;
      font-size: 0.95rem;
      resize: vertical;
      min-height: 80px;
      font-family: inherit;
    }
    .button-group {
      display: flex;
      gap: 10px;
      margin: 20px 0;
      flex-wrap: wrap;
    }
    button {
      background-color: #2563eb;
      color: white;
      border: none;
      padding: 10px 20px;
      font-size: 0.95rem;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 500;
      transition: background-color 0.2s;
    }
    button:hover:not(:disabled) {
      background-color: #1d4ed8;
    }
    button:disabled {
      background-color: #93c5fd;
      cursor: not-allowed;
    }
    button.secondary {
      background-color: #475569;
    }
    button.secondary:hover:not(:disabled) {
      background-color: #334155;
    }
    button.success {
      background-color: #059669;
    }
    button.success:hover:not(:disabled) {
      background-color: #047857;
    }
    #status {
      margin: 15px 0;
      font-weight: 600;
      color: #1e293b;
    }
    #log {
      background: #f1f5f9;
      border: 1px solid #cbd5e1;
      padding: 12px;
      border-radius: 6px;
      font-family: Consolas, Monaco, monospace;
      font-size: 0.85rem;
      white-space: pre-wrap;
      max-height: 220px;
      overflow-y: auto;
      color: #334155;
    }
  </style>
</head>
<body>

  <h1>Style-BERT-VITS2 音声合成プレイヤー</h1>

  <div class="notice">
    <strong>【ご利用上の注意・前提事項】</strong>
    <ul>
      <li>ブラウザ上で直接モデル推論を行うため、初回ロードと初回生成に数十秒〜数分かかる場合があります。</li>
      <li>スマートフォン等の低スペック環境ではメモリ不足によりクラッシュする可能性があります。PC環境での実行を推奨します。</li>
      <li>音声が再生されない場合は、ブラウザの音量設定およびコンソールログをご確認ください。</li>
    </ul>
  </div>

  <div class="form-group">
    <label for="inputText">発話テキスト:</label>
    <textarea id="inputText">こんにちは。村瀬亮介の音声テストプレイヤーへようこそ。ブラウザ上で動作しています。</textarea>
  </div>

  <div class="button-group">
    <button id="playBtn" onclick="synthesize()">音声を合成・再生</button>
    <button id="downloadBtn" class="success" onclick="downloadWav()" disabled>WAVをダウンロード</button>
  </div>

  <div id="status">待機中</div>
  <div id="log">ログがここに表示されます...</div>

  <script>
    ort.env.wasm.numThreads = 1;
    ort.env.wasm.simd = true;

    let session = null;
    let audioCtx = null;
    let lastAudioData = null; // ダウンロード用の音声バッファ保持
    const SAMPLE_RATE = 44100;

    function log(msg) {
      console.log(msg);
      const logElem = document.getElementById("log");
      logElem.textContent += "\n" + msg;
      logElem.scrollTop = logElem.scrollHeight;
    }

    function setStatus(msg) {
      document.getElementById("status").textContent = msg;
    }

    // 分割モデルの自動結合ロード
    async function loadModel() {
      setStatus("モデルファイル (models/model_part*.bin) を探索・読み込み中...");
      const chunks = [];
      let idx = 0;
      
      while (true) {
        const partPath = `./models/model_part${idx}.bin`;
        try {
          const res = await fetch(partPath);
          if (!res.ok) {
            if (idx === 0) throw new Error(`${partPath} が見つかりません。`);
            break;
          }
          const buf = await res.arrayBuffer();
          chunks.push(new Uint8Array(buf));
          log(`✓ チャンク読み込み: model_part${idx}.bin (${(buf.byteLength / 1024 / 1024).toFixed(1)} MB)`);
          idx++;
        } catch (e) {
          if (idx === 0) throw e;
          break;
        }
      }

      log(`合計 ${chunks.length} 個のチャンクを結合中...`);
      const totalLength = chunks.reduce((acc, c) => acc + c.length, 0);
      const merged = new Uint8Array(totalLength);
      let offset = 0;
      for (const chunk of chunks) {
        merged.set(chunk, offset);
        offset += chunk.length;
      }

      log(`ONNX Runtime セッションを初期化中 (${(totalLength / 1024 / 1024).toFixed(1)} MB)...`);
      session = await ort.InferenceSession.create(merged.buffer, {
        executionProviders: ['wasm']
      });
      log("✅ モデルのロードが完了しました。");
    }

    // 音声合成処理
    async function synthesize() {
      const btn = document.getElementById("playBtn");
      const dlBtn = document.getElementById("downloadBtn");
      btn.disabled = true;
      dlBtn.disabled = true;

      try {
        if (!session) {
          await loadModel();
        }

        setStatus("入力テンソルデータを読み込み中...");
        const res = await fetch("./exact_input.json?t=" + Date.now());
        if (!res.ok) throw new Error("exact_input.json が見つかりません。");
        const payload = await res.json();

        // 低ノイズ化パラメータの適用
        if (payload.noise_scale) payload.noise_scale.data = [0.35];
        if (payload.noise_scale_w) payload.noise_scale_w.data = [0.6];
        if (payload.sdp_ratio) payload.sdp_ratio.data = [0.0];

        const feeds = {};
        const aliasMap = { x_tst: "x", x_tst_lengths: "x_lengths", speakers: "sid", tones: "tone" };

        for (const inputName of session.inputNames) {
          let sourceKey = inputName;
          if (!payload[sourceKey]) {
            sourceKey = Object.keys(aliasMap).find(k => aliasMap[k] === inputName || k === inputName) || inputName;
          }

          const item = payload[sourceKey] || payload[aliasMap[sourceKey]];
          if (item) {
            let shape = [...item.shape];
            if (inputName.includes("style") && shape.length === 2) {
              shape = [1, 1, 256];
            }

            if (item.dtype === "int64") {
              const bigArr = new BigInt64Array(item.data.map(v => BigInt(v)));
              feeds[inputName] = new ort.Tensor("int64", bigArr, shape);
            } else {
              const f32Arr = new Float32Array(item.data);
              feeds[inputName] = new ort.Tensor("float32", f32Arr, shape);
            }
          }
        }

        setStatus("音声合成中（ブラウザ上で推論を実行しています）...");
        const tStart = performance.now();
        const results = await session.run(feeds);
        const tInfer = ((performance.now() - tStart) / 1000).toFixed(2);
        log(`推論完了: ${tInfer} 秒`);

        const outputName = session.outputNames[0];
        lastAudioData = results[outputName].data; // 音声データを保存

        // Web Audio API による再生
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: SAMPLE_RATE });
        }
        if (audioCtx.state === "suspended") {
          await audioCtx.resume();
        }

        const audioBuffer = audioCtx.createBuffer(1, lastAudioData.length, SAMPLE_RATE);
        audioBuffer.copyToChannel(lastAudioData, 0);

        const source = audioCtx.createBufferSource();
        source.buffer = audioBuffer;
        source.connect(audioCtx.destination);
        source.start();

        setStatus("再生中 🔊");
        log("✅ 音声を再生しました。");
        dlBtn.disabled = false; // ダウンロードを有効化
      } catch (err) {
        setStatus("エラーが発生しました");
        log("❌ " + err.message);
        console.error(err);
      } finally {
        btn.disabled = false;
      }
    }

    // --- WAV ダウンロード機能 ---
    function downloadWav() {
      if (!lastAudioData) return;

      const wavBlob = encodeWAV(lastAudioData, SAMPLE_RATE);
      const url = URL.createObjectURL(wavBlob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `voice_${Date.now()}.wav`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      log("💾 WAVファイルをダウンロードしました。");
    }

    // Float32Array を 16-bit PCM WAV Blob に変換
    function encodeWAV(samples, sampleRate) {
      const buffer = new ArrayBuffer(44 + samples.length * 2);
      const view = new DataView(buffer);

      function writeString(view, offset, string) {
        for (let i = 0; i < string.length; i++) {
          view.setUint8(offset + i, string.charCodeAt(i));
        }
      }

      writeString(view, 0, 'RIFF');
      view.setUint32(4, 36 + samples.length * 2, true);
      writeString(view, 8, 'WAVE');
      writeString(view, 12, 'fmt ');
      view.setUint32(16, 16, true); // SubChunk1Size (16 for PCM)
      view.setUint16(20, 1, true);  // AudioFormat (1: PCM)
      view.setUint16(22, 1, true);  // NumChannels (1: Mono)
      view.setUint32(24, sampleRate, true);
      view.setUint32(28, sampleRate * 2, true); // ByteRate
      view.setUint16(32, 2, true);  // BlockAlign
      view.setUint16(34, 16, true); // BitsPerSample
      writeString(view, 36, 'data');
      view.setUint32(40, samples.length * 2, true);

      // Float -> 16-bit PCM
      let offset = 44;
      for (let i = 0; i < samples.length; i++, offset += 2) {
        let s = Math.max(-1, Math.min(1, samples[i]));
        view.setInt16(offset, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
      }

      return new Blob([view], { type: 'audio/wav' });
    }
  </script>
</body>
</html>
