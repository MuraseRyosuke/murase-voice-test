<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Style-BERT-VITS2 Web Player</title>
  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #1e293b;
      --border: #e2e8f0;
      --accent: #f59e0b;
    }

    body {
      margin: 0;
      padding: 20px 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 520px;
      background: var(--card-bg);
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
      border: 1px solid var(--border);
    }

    h1 {
      font-size: 1.25rem;
      margin-top: 0;
      margin-bottom: 6px;
      text-align: center;
    }

    p.sub {
      font-size: 0.85rem;
      color: #64748b;
      text-align: center;
      margin-bottom: 20px;
    }

    /* 同意バナー */
    .banner {
      background-color: #fffbeb;
      border: 1px solid #fef3c7;
      border-left: 4px solid var(--accent);
      padding: 12px;
      border-radius: 8px;
      font-size: 0.85rem;
      line-height: 1.5;
      margin-bottom: 16px;
    }

    .banner strong {
      color: #b45309;
    }

    textarea {
      width: 100%;
      height: 90px;
      box-sizing: border-box;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      font-size: 0.95rem;
      resize: vertical;
      margin-bottom: 16px;
    }

    textarea:focus {
      outline: none;
      border-color: var(--primary);
    }

    .btn {
      width: 100%;
      padding: 12px;
      font-size: 1rem;
      font-weight: 600;
      color: white;
      background-color: var(--primary);
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn:hover:not(:disabled) {
      background-color: var(--primary-hover);
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .progress-bar {
      width: 100%;
      height: 6px;
      background: #e2e8f0;
      border-radius: 3px;
      overflow: hidden;
      margin: 16px 0;
      display: none;
    }

    .progress-fill {
      width: 0%;
      height: 100%;
      background: var(--primary);
      transition: width 0.2s;
    }

    #status-text {
      font-size: 0.85rem;
      color: #64748b;
      text-align: center;
      margin-top: 8px;
    }

    .audio-player-area {
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
      display: none;
      flex-direction: column;
      gap: 12px;
    }

    audio {
      width: 100%;
    }

    .download-link {
      display: block;
      text-align: center;
      text-decoration: none;
      color: var(--primary);
      font-weight: 600;
      font-size: 0.9rem;
      padding: 8px;
      border: 1px dashed var(--primary);
      border-radius: 6px;
      background: #eef2ff;
    }
  </style>

  <!-- ONNX Runtime Web CDN -->
  <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.min.js"></script>
</head>
<body>

<div class="container">
  <h1>村瀬亮介 音声プレイヤー (Web Test)</h1>
  <p class="sub">Style-BERT-VITS2 INT8 ブラウザ推論</p>

  <!-- Wi-Fi推奨 警告バナー -->
  <div id="agreement-box" class="banner">
    <strong>⚠️ データ通信量のご注意</strong><br>
    ブラウザ上で直接音声を生成するため、初回実行時に量子化モデルデータ（分割バイナリ 計約150MB）を並列ダウンロードします。<strong>Wi-Fi環境でのご利用を推奨します。</strong>
  </div>

  <textarea id="inputText" placeholder="話させたいテキストを入力してください...">こんにちは。ブラウザ上で動作するStyle-BERT-VITS2の音声テストです。</textarea>

  <button id="actionBtn" class="btn">モデルを読み込んで音声を生成</button>

  <div id="progress" class="progress-bar">
    <div id="progress-fill" class="progress-fill"></div>
  </div>

  <div id="status-text"></div>

  <!-- 生成後のオーディオ・ダウンロード -->
  <div id="audio-area" class="audio-player-area">
    <audio id="audioPlayer" controls></audio>
    <a id="downloadBtn" class="download-link" href="#" download="voice.wav">📥 音声ファイル (.wav) を保存</a>
  </div>
</div>

<script>
  let vitsSession = null;
  let bertSession = null;
  let bertVocab = {};

  // --- 分割ファイル・辞書のパス設定 (modelsフォルダ配下) ---
  const VITS_CHUNKS = [
    './models/model_part0.bin',
    './models/model_part1.bin',
    './models/model_part2.bin'
  ];

  const BERT_CHUNKS = [
    './models/bert_part0.bin',
    './models/bert_part1.bin',
    './models/bert_part2.bin',
    './models/bert_part3.bin',
    './models/bert_part4.bin',
    './models/bert_part5.bin'
  ];

  const VOCAB_URL = './models/vocab.txt';

  const btn = document.getElementById('actionBtn');
  const statusText = document.getElementById('status-text');
  const progress = document.getElementById('progress');
  const progressFill = document.getElementById('progress-fill');
  const audioArea = document.getElementById('audio-area');
  const audioPlayer = document.getElementById('audioPlayer');
  const downloadBtn = document.getElementById('downloadBtn');
  const agreementBox = document.getElementById('agreement-box');

  // 分割バイナリを並列ダウンロードしてメモリ上で1つに結合する関数
  async function fetchAndCombineChunks(chunkUrls) {
    const buffers = await Promise.all(
      chunkUrls.map(async (url) => {
        const res = await fetch(url);
        if (!res.ok) throw new Error(`ダウンロード失敗: ${url}`);
        return await res.arrayBuffer();
      })
    );

    const totalLength = buffers.reduce((sum, buf) => sum + buf.byteLength, 0);
    const combinedArray = new Uint8Array(totalLength);
    let offset = 0;
    for (const buf of buffers) {
      combinedArray.set(new Uint8Array(buf), offset);
      offset += buf.byteLength;
    }
    return combinedArray.buffer;
  }

  // エンジンとモデルの並列初期化
  async function initializeEngine() {
    progress.style.display = 'block';
    progressFill.style.width = '15%';
    statusText.textContent = '辞書データを取得中...';

    ort.env.wasm.numThreads = navigator.hardwareConcurrency ? Math.min(4, navigator.hardwareConcurrency) : 2;

    // 1. BERT辞書 (vocab.txt) のロード
    const vocabRes = await fetch(VOCAB_URL);
    if (!vocabRes.ok) throw new Error('vocab.txt の読み込みに失敗しました');
    const vocabText = await vocabRes.text();
    vocabText.split('\n').forEach((token, idx) => {
      const t = token.trim();
      if (t) bertVocab[t] = idx;
    });

    // 2. 日本語BERTモデルの取得 & ロード
    progressFill.style.width = '40%';
    statusText.textContent = '日本語BERTモデルを並列ダウンロード中...';
    const bertBuffer = await fetchAndCombineChunks(BERT_CHUNKS);

    progressFill.style.width = '60%';
    statusText.textContent = 'BERTセッションを作成中...';
    bertSession = await ort.InferenceSession.create(bertBuffer, {
      executionProviders: ['wasm']
    });

    // 3. VITS 音声生成モデルの取得 & ロード
    progressFill.style.width = '80%';
    statusText.textContent = '音声合成モデルを並列ダウンロード中...';
    const vitsBuffer = await fetchAndCombineChunks(VITS_CHUNKS);

    progressFill.style.width = '95%';
    statusText.textContent = '音声モデルセッションを作成中...';
    vitsSession = await ort.InferenceSession.create(vitsBuffer, {
      executionProviders: ['wasm']
    });

    progressFill.style.width = '100%';
    statusText.textContent = 'モデルの準備が完了しました！';
    agreementBox.style.display = 'none';
  }

  // 簡易トークナイズ処理 (BERT WordPiece 辞書引き)
  function tokenizeText(text) {
    const tokens = ['[CLS]'];
    for (const char of text) {
      if (char in bertVocab) {
        tokens.push(char);
      } else {
        tokens.push('[UNK]');
      }
    }
    tokens.push('[SEP]');

    const unkId = bertVocab['[UNK]'] ?? 1;
    const inputIds = tokens.map(t => bertVocab[t] ?? unkId);

    return {
      inputIds: BigInt64Array.from(inputIds.map(BigInt)),
      length: tokens.length
    };
  }

  // Float32Array波形からWAV Blobを生成
  function createWavBlob(samples, sampleRate = 44100) {
    const buffer = new ArrayBuffer(44 + samples.length * 2);
    const view = new DataView(buffer);

    function writeString(offset, string) {
      for (let i = 0; i < string.length; i++) {
        view.setUint8(offset + i, string.charCodeAt(i));
      }
    }

    writeString(0, 'RIFF');
    view.setUint32(4, 36 + samples.length * 2, true);
    writeString(8, 'WAVE');
    writeString(12, 'fmt ');
    view.setUint32(16, 16, true);
    view.setUint16(20, 1, true); // PCM
    view.setUint16(22, 1, true); // Mono
    view.setUint32(24, sampleRate, true);
    view.setUint32(28, sampleRate * 2, true);
    view.setUint16(32, 2, true);
    view.setUint16(34, 16, true);
    writeString(36, 'data');
    view.setUint32(40, samples.length * 2, true);

    let offset = 44;
    for (let i = 0; i < samples.length; i++, offset += 2) {
      const s = Math.max(-1, Math.min(1, samples[i]));
      view.setInt16(offset, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
    }

    return new Blob([view], { type: 'audio/wav' });
  }

  // 音声合成の実行
  btn.addEventListener('click', async () => {
    const text = document.getElementById('inputText').value.trim();
    if (!text) return;

    btn.disabled = true;

    try {
      if (!vitsSession || !bertSession) {
        await initializeEngine();
      }

      statusText.textContent = '言語特徴量を抽出中...';

      // 1. テキストのトークナイズ
      const tokenized = tokenizeText(text);
      const seqLen = tokenized.length;

      // 2. BERT 推論 (文脈特徴量 768次元の抽出)
      const bertFeeds = {
        input_ids: new ort.Tensor('int64', tokenized.inputIds, [1, seqLen]),
        attention_mask: new ort.Tensor('int64', new BigInt64Array(seqLen).fill(1n), [1, seqLen]),
        token_type_ids: new ort.Tensor('int64', new BigInt64Array(seqLen).fill(0n), [1, seqLen])
      };

      const bertResults = await bertSession.run(bertFeeds);
      const bertFeatures = bertResults.last_hidden_state; // [1, seqLen, 768]

      statusText.textContent = '音声を生成中...';

      // 3. VITS 入力テンソルの動的構築
      const dummyPhones = new BigInt64Array(seqLen).map((_, i) => BigInt((i % 20) + 1));
      const dummyTones = new BigInt64Array(seqLen).fill(0n);

      const vitsFeeds = {};
      for (const name of vitsSession.inputNames) {
        if (name === 'x_tst') {
          vitsFeeds[name] = new ort.Tensor('int64', dummyPhones, [1, seqLen]);
        } else if (name === 'x_tst_lengths') {
          vitsFeeds[name] = new ort.Tensor('int64', BigInt64Array.from([BigInt(seqLen)]), [1]);
        } else if (name === 'speakers' || name === 'sid') {
          vitsFeeds[name] = new ort.Tensor('int64', BigInt64Array.from([0n]), [1]);
        } else if (name === 'tones') {
          vitsFeeds[name] = new ort.Tensor('int64', dummyTones, [1, seqLen]);
        } else if (name === 'language' || name === 'lang_ids') {
          vitsFeeds[name] = new ort.Tensor('int64', new BigInt64Array(seqLen).fill(0n), [1, seqLen]);
        } else if (name === 'ja_bert' || name === 'bert') {
          vitsFeeds[name] = bertFeatures;
        } else if (name.includes('bert')) {
          // en_bert, zh_bert などの多言語用ダミーゼロテンソル
          const dims = bertFeatures.dims;
          const totalElements = dims.reduce((a, b) => a * b, 1);
          vitsFeeds[name] = new ort.Tensor('float32', new Float32Array(totalElements), dims);
        } else if (name === 'style_vec') {
          vitsFeeds[name] = new ort.Tensor('float32', new Float32Array(256), [1, 1, 256]);
        } else if (name === 'noise_scale') {
          vitsFeeds[name] = new ort.Tensor('float32', Float32Array.from([0.667]), [1]);
        } else if (name === 'length_scale') {
          vitsFeeds[name] = new ort.Tensor('float32', Float32Array.from([1.0]), [1]);
        } else if (name === 'noise_scale_w') {
          vitsFeeds[name] = new ort.Tensor('float32', Float32Array.from([0.8]), [1]);
        } else if (name === 'sdp_ratio') {
          vitsFeeds[name] = new ort.Tensor('float32', Float32Array.from([0.2]), [1]);
        } else {
          // その他未知の入力に対するフォールバック
          vitsFeeds[name] = new ort.Tensor('float32', Float32Array.from([0.0]), [1]);
        }
      }

      // 4. VITS Generator 推論
      const vitsResults = await vitsSession.run(vitsFeeds);
      const outputKey = vitsSession.outputNames[0];
      const audioData = vitsResults[outputKey].data;

      // 5. WAV 生成 & 再生
      const sampleRate = 44100;
      const wavBlob = createWavBlob(audioData, sampleRate);
      const audioUrl = URL.createObjectURL(wavBlob);

      audioPlayer.src = audioUrl;
      downloadBtn.href = audioUrl;
      downloadBtn.download = `voice_${Date.now()}.wav`;

      audioArea.style.display = 'flex';
      audioPlayer.play();
      statusText.textContent = '音声合成完了！';
      btn.textContent = '音声を生成する';
    } catch (err) {
      console.error(err);
      statusText.textContent = 'エラーが発生しました。コンソール(F12)をご確認ください。';
    } finally {
      btn.disabled = false;
      progress.style.display = 'none';
    }
  });
</script>

</body>
</html>
