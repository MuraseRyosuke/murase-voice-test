<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Style-BERT-VITS2 Web Player</title>
  <!-- 最新の ONNX Runtime Web (WebGPU & WASM 対応) -->
  <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.18.0/dist/ort.all.min.js"></script>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f8fafc;
      --subtext: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --success: #34d399;
      --border: #334155;
    }
    body {
      margin: 0;
      padding: 2rem 1rem;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
    }
    .container {
      width: 100%;
      max-width: 640px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 1rem;
      padding: 2rem;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
    }
    h1 {
      font-size: 1.5rem;
      margin: 0 0 0.5rem;
      font-weight: 700;
    }
    p {
      color: var(--subtext);
      margin: 0 0 1.5rem;
      font-size: 0.9rem;
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.8rem;
      padding: 0.35rem 0.75rem;
      border-radius: 9999px;
      background: #0f172a;
      border: 1px solid var(--border);
      margin-bottom: 1.5rem;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--subtext);
    }
    .dot.active { background: var(--success); }
    .controls {
      display: grid;
      gap: 1rem;
      margin-bottom: 1.5rem;
      background: #0f172a80;
      padding: 1rem;
      border-radius: 0.5rem;
      border: 1px solid var(--border);
    }
    .control-group {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
    }
    input[type="range"] {
      width: 160px;
      accent-color: var(--accent);
    }
    button {
      width: 100%;
      padding: 0.875rem;
      background: var(--accent);
      color: #0f172a;
      font-weight: 700;
      border: none;
      border-radius: 0.5rem;
      cursor: pointer;
      font-size: 1rem;
      transition: all 0.2s;
    }
    button:hover:not(:disabled) {
      background: var(--accent-hover);
      color: #fff;
    }
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .log-box {
      margin-top: 1.5rem;
      background: #090d16;
      border: 1px solid var(--border);
      border-radius: 0.5rem;
      padding: 0.75rem;
      font-family: monospace;
      font-size: 0.75rem;
      color: var(--subtext);
      max-height: 140px;
      overflow-y: auto;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>Style-BERT-VITS2 音声プレイヤー</h1>
  <p>ブラウザ上で WebGPU / WASM 高速推論を行います。</p>

  <div class="status-badge">
    <span class="dot" id="statusDot"></span>
    <span id="backendStatus">バックエンド: 初期化待機中</span>
  </div>

  <div class="controls">
    <div class="control-group">
      <label for="noiseScale">Noise Scale (ざらつき抑制): <span id="noiseVal">0.35</span></label>
      <input type="range" id="noiseScale" min="0.1" max="1.0" step="0.05" value="0.35" />
    </div>
    <div class="control-group">
      <label for="noiseScaleW">Noise Scale W (音素長安定化): <span id="noiseWVal">0.60</span></label>
      <input type="range" id="noiseScaleW" min="0.1" max="1.0" step="0.05" value="0.60" />
    </div>
    <div class="control-group">
      <label for="sdpRatio">SDP Ratio (決定論的生成): <span id="sdpVal">0.00</span></label>
      <input type="range" id="sdpRatio" min="0.0" max="1.0" step="0.05" value="0.00" />
    </div>
  </div>

  <button id="playBtn">モデルをロードして音声を合成・再生</button>

  <div class="log-box" id="logs">ログがここに表示されます...</div>
</div>

<script>
  // --- 1. 最適化バックエンドの設定 ---
  ort.env.wasm.numThreads = Math.min(navigator.hardwareConcurrency || 4, 8);
  ort.env.wasm.simd = true;

  let session = null;
  let audioCtx = null;

  const logBox = document.getElementById("logs");
  const playBtn = document.getElementById("playBtn");
  const statusDot = document.getElementById("statusDot");
  const backendStatus = document.getElementById("backendStatus");

  function log(msg) {
    console.log(msg);
    logBox.textContent += `\n[${new Date().toLocaleTimeString()}] ${msg}`;
    logBox.scrollTop = logBox.scrollHeight;
  }

  // スライダー表示連動
  document.getElementById("noiseScale").oninput = (e) => document.getElementById("noiseVal").textContent = parseFloat(e.target.value).toFixed(2);
  document.getElementById("noiseScaleW").oninput = (e) => document.getElementById("noiseWVal").textContent = parseFloat(e.target.value).toFixed(2);
  document.getElementById("sdpRatio").oninput = (e) => document.getElementById("sdpVal").textContent = parseFloat(e.target.value).toFixed(2);

  // --- 2. モデルのロード処理 ---
  async function loadModel() {
    log("モデルファイル探索中 (model.onnx)...");
    
    // WebGPU を最優先、非対応環境では自動でマルチスレッド WASM にフォールバック
    const options = {
      executionProviders: ['webgpu', 'wasm'],
      graphOptimizationLevel: 'all'
    };

    try {
      session = await ort.InferenceSession.create('./model.onnx', options);
    } catch (e) {
      log("単一ファイルが見つからないため、分割チャンク結合を試行します...");
      // 分割ファイル (model.onnx.part_00 等) がある場合のフォールバック結合
      session = await loadChunkedModel(options);
    }

    statusDot.classList.add("active");
    // 使用されたバックエンドの判定表示
    const currentProvider = navigator.gpu ? "WebGPU (GPU並列アクセラレーション)" : "WASM (CPU マルチスレッド SIMD)";
    backendStatus.textContent = `バックエンド: ${currentProvider}`;
    log(`モデルロード完了 [実行環境: ${currentProvider}]`);
  }

  async function loadChunkedModel(options) {
    const chunks = [];
    let idx = 0;
    while (true) {
      const partName = `./model.onnx.part_${String(idx).padStart(2, '0')}`;
      try {
        const res = await fetch(partName);
        if (!res.ok) break;
        const buf = await res.arrayBuffer();
        chunks.push(new Uint8Array(buf));
        log(`チャンク読み込み: part_${String(idx).padStart(2, '0')} (${(buf.byteLength / 1024 / 1024).toFixed(1)} MB)`);
        idx++;
      } catch (err) {
        break;
      }
    }
    if (chunks.length === 0) throw new Error("ONNXモデルファイルが見つかりません。");

    const totalLen = chunks.reduce((acc, c) => acc + c.length, 0);
    const merged = new Uint8Array(totalLen);
    let offset = 0;
    for (const chunk of chunks) {
      merged.set(chunk, offset);
      offset += chunk.length;
    }
    return await ort.InferenceSession.create(merged.buffer, options);
  }

  // --- 3. 音声合成と再生 ---
  async function synthesizeAndPlay() {
    playBtn.disabled = true;
    const startTime = performance.now();

    try {
      if (!session) {
        log("初回モデルロードを開始します...");
        await loadModel();
      }

      log("入力データ (exact_input.json) を読み込み中...");
      const res = await fetch("./exact_input.json?t=" + Date.now());
      if (!res.ok) throw new Error("exact_input.json の取得に失敗しました。");
      const payload = await res.json();

      // UI の低ノイズパラメータをテンソルに上書き適用
      const userNoiseScale = parseFloat(document.getElementById("noiseScale").value);
      const userNoiseScaleW = parseFloat(document.getElementById("noiseScaleW").value);
      const userSdpRatio = parseFloat(document.getElementById("sdpRatio").value);

      if (payload.noise_scale) payload.noise_scale.data = [userNoiseScale];
      if (payload.noise_scale_w) payload.noise_scale_w.data = [userNoiseScaleW];
      if (payload.sdp_ratio) payload.sdp_ratio.data = [userSdpRatio];

      log(`パラメータ適用: noise_scale=${userNoiseScale}, sdp_ratio=${userSdpRatio}`);

      // ONNX 入力テンソルの作成
      const feeds = {};
      const aliasMap = { x_tst: "x", x_tst_lengths: "x_lengths", speakers: "sid", tones: "tone" };

      for (const inputName of session.inputNames) {
        let sourceKey = inputName;
        if (!payload[sourceKey]) {
          // エイリアス解決
          sourceKey = Object.keys(aliasMap).find(k => aliasMap[k] === inputName || k === inputName) || inputName;
        }

        const item = payload[sourceKey] || payload[aliasMap[sourceKey]];
        if (item) {
          let shape = [...item.shape];
          // ランク（次元数）の整合性補正 (style_vec 等)
          if (inputName.includes("style") && shape.length === 2) {
            shape = [1, 1, 256];
          }

          if (item.dtype === "int64") {
            const bigArr = new BigInt64Array(item.data.map(v => BigInt(v)));
            feeds[inputName] = new ort.Tensor("int64", bigArr, shape);
          } else {
            const f32Arr = new Float32Array(item.data);
            feeds[inputName] = new ort.Tensor("float32", f32Arr, shape);
          }
        }
      }

      log("ONNX 推論実行中...");
      const inferStart = performance.now();
      const results = await session.run(feeds);
      const inferTime = ((performance.now() - inferStart) / 1000).toFixed(2);

      const outputName = session.outputNames[0];
      const audioData = results[outputName].data; // Float32Array (音声波形)
      log(`推論完了: ${inferTime} 秒 (総処理: ${((performance.now() - startTime) / 1000).toFixed(2)} 秒)`);

      // Web Audio API で再生
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 44100 });
      }
      if (audioCtx.state === "suspended") {
        await audioCtx.resume();
      }

      const audioBuffer = audioCtx.createBuffer(1, audioData.length, 44100);
      audioBuffer.copyToChannel(audioData, 0);

      const source = audioCtx.createBufferSource();
      source.buffer = audioBuffer;
      source.connect(audioCtx.destination);
      source.start();

      log("🔊 再生中...");
    } catch (err) {
      log(`❌ エラー: ${err.message}`);
      console.error(err);
    } finally {
      playBtn.disabled = false;
    }
  }

  playBtn.addEventListener("click", synthesizeAndPlay);
</script>

</body>
</html>
