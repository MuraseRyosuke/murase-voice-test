<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Style-BERT-VITS2 音声合成プレイヤー</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      max-width: 720px;
      margin: 40px auto;
      padding: 0 20px;
      line-height: 1.6;
      color: #1e293b;
      background-color: #f8fafc;
    }
    h1 {
      font-size: 1.5rem;
      border-bottom: 2px solid #e2e8f0;
      padding-bottom: 10px;
      margin-bottom: 16px;
    }
    .notice {
      background-color: #eff6ff;
      border-left: 4px solid #3b82f6;
      padding: 12px 16px;
      margin-bottom: 16px;
      font-size: 0.9rem;
      color: #1e40af;
      border-radius: 0 4px 4px 0;
    }
    .notice ul {
      margin: 4px 0 0;
      padding-left: 18px;
    }
    .form-group {
      margin: 16px 0;
    }
    label {
      display: block;
      font-weight: 600;
      margin-bottom: 6px;
      font-size: 0.9rem;
    }
    textarea {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      border-radius: 6px;
      border: 1px solid #cbd5e1;
      font-size: 1rem;
      font-family: inherit;
      background-color: #fff;
      resize: vertical;
      min-height: 80px;
    }
    .player-card {
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 16px;
      margin: 16px 0;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    audio {
      width: 100%;
      height: 40px;
    }
    .button-group {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    button {
      background-color: #2563eb;
      color: white;
      border: none;
      padding: 10px 22px;
      font-size: 0.95rem;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s;
    }
    button:hover:not(:disabled) {
      background-color: #1d4ed8;
    }
    button:disabled {
      background-color: #93c5fd;
      cursor: not-allowed;
    }
    button.success {
      background-color: #059669;
    }
    button.success:hover:not(:disabled) {
      background-color: #047857;
    }
    #status {
      margin: 10px 0;
      font-weight: 600;
      font-size: 0.9rem;
    }
    #log {
      background: #0f172a;
      border: 1px solid #334155;
      padding: 12px;
      border-radius: 6px;
      font-family: Consolas, Monaco, monospace;
      font-size: 0.8rem;
      white-space: pre-wrap;
      max-height: 160px;
      overflow-y: auto;
      color: #94a3b8;
    }
  </style>
</head>
<body>

  <h1>Style-BERT-VITS2 音声合成プレイヤー</h1>

  <div class="notice">
    <strong>【ご利用上の案内】</strong>
    <ul>
      <li>Hugging Face Spaces（ZeroGPU）と連携し、漢字混じりの自由な文章を高速合成します。</li>
      <li>一度生成した音声はキャッシュされ、プレイヤーで再生・一時停止・シーク・WAV保存が自由に行えます。</li>
    </ul>
  </div>

  <div class="form-group">
    <label for="inputText">発話テキスト（漢字・ひらがな・カタカナ対応）:</label>
    <textarea id="inputText" placeholder="喋らせたいテキストを入力してください...">こんにちは。村瀬亮介の音声合成プレイヤーへようこそ。自由なテキストを滑らかに発話できます。</textarea>
  </div>

  <div class="button-group">
    <button id="playBtn">音声を合成して再生</button>
  </div>

  <div class="player-card">
    <label>🔊 音声コントロール:</label>
    <audio id="audioPlayer" controls></audio>
    <div>
      <button id="downloadBtn" class="success" disabled>WAVを保存</button>
    </div>
  </div>

  <div id="status">待機中</div>
  <div id="log">ログがここに表示されます...</div>

  <script type="module">
    import { Client } from "https://cdn.jsdelivr.net/npm/@gradio/client@latest/+esm";

    const SPACE_ID = "muraseryosuke/murase-voice-vits2";

    let app = null;
    let currentAudioUrl = null;
    const audioCache = new Map();

    const audioPlayer = document.getElementById("audioPlayer");
    const downloadBtn = document.getElementById("downloadBtn");
    const playBtn = document.getElementById("playBtn");
    const logBox = document.getElementById("log");
    const statusBox = document.getElementById("status");

    function log(msg) {
      console.log(msg);
      logBox.textContent += "\n" + msg;
      logBox.scrollTop = logBox.scrollHeight;
    }

    function setStatus(msg) {
      statusBox.textContent = msg;
    }

    async function initClient() {
      if (!app) {
        setStatus("推論バックエンドに接続中...");
        log(`Connecting to Hugging Face Space: ${SPACE_ID}...`);
        app = await Client.connect(SPACE_ID);
        log("✅ バックエンドへの接続に成功しました。");
      }
    }

    async function synthesize() {
      const text = document.getElementById("inputText").value.trim();
      if (!text) {
        alert("テキストを入力してください。");
        return;
      }

      if (audioCache.has(text)) {
        log(`⚡ キャッシュから即座に再生: 「${text}」`);
        currentAudioUrl = audioCache.get(text);
        audioPlayer.src = currentAudioUrl;
        audioPlayer.play();
        downloadBtn.disabled = false;
        setStatus("再生中 🔊 (キャッシュ)");
        return;
      }

      playBtn.disabled = true;
      downloadBtn.disabled = true;

      try {
        await initClient();

        setStatus("音声を生成中 (ZeroGPU で推論中)...");
        const tStart = performance.now();

        // 明示的なエンドポイント /synthesize を呼び出し
        const result = await app.predict("/synthesize", [
          text,
          0.35,
          0.6,
          0.0
        ]);

        const totalSec = ((performance.now() - tStart) / 1000).toFixed(2);
        log(`✓ 音声生成完了: ${totalSec} 秒`);

        const audioItem = result.data[0];
        currentAudioUrl = typeof audioItem === "string" ? audioItem : (audioItem.url || audioItem.path);

        audioCache.set(text, currentAudioUrl);

        audioPlayer.src = currentAudioUrl;
        audioPlayer.play();
        downloadBtn.disabled = false;
        setStatus("再生中 🔊");
      } catch (err) {
        setStatus("エラーが発生しました");
        log("❌ " + (err.message || String(err)));
        console.error(err);
      } finally {
        playBtn.disabled = false;
      }
    }

    function downloadAudio() {
      if (!currentAudioUrl) return;
      const a = document.createElement("a");
      a.href = currentAudioUrl;
      a.download = `voice_${Date.now()}.wav`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      log("💾 音声ファイルをダウンロードしました。");
    }

    playBtn.addEventListener("click", synthesize);
    downloadBtn.addEventListener("click", downloadAudio);
  </script>
</body>
</html>
