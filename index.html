<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Style-BERT-VITS2 Web Player (Exact Demo)</title>
  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #1e293b;
      --border: #e2e8f0;
      --accent: #f59e0b;
    }

    body {
      margin: 0;
      padding: 24px 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 520px;
      background: var(--card-bg);
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
      border: 1px solid var(--border);
    }

    h1 {
      font-size: 1.25rem;
      margin-top: 0;
      margin-bottom: 6px;
      text-align: center;
    }

    p.sub {
      font-size: 0.85rem;
      color: #64748b;
      text-align: center;
      margin-bottom: 20px;
    }

    .banner {
      background-color: #fffbeb;
      border-left: 4px solid var(--accent);
      padding: 12px;
      border-radius: 8px;
      font-size: 0.85rem;
      line-height: 1.5;
      margin-bottom: 16px;
    }

    .sample-box {
      background: #f1f5f9;
      padding: 12px;
      border-radius: 8px;
      font-size: 0.95rem;
      color: #334155;
      margin-bottom: 16px;
      border: 1px solid var(--border);
      line-height: 1.5;
    }

    .btn {
      width: 100%;
      padding: 12px;
      font-size: 1rem;
      font-weight: 600;
      color: white;
      background-color: var(--primary);
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn:hover:not(:disabled) {
      background-color: var(--primary-hover);
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .progress-bar {
      width: 100%;
      height: 6px;
      background: #e2e8f0;
      border-radius: 3px;
      overflow: hidden;
      margin: 16px 0;
      display: none;
    }

    .progress-fill {
      width: 0%;
      height: 100%;
      background: var(--primary);
      transition: width 0.2s;
    }

    #status-text {
      font-size: 0.85rem;
      color: #64748b;
      text-align: center;
      margin-top: 8px;
    }

    .audio-player-area {
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
      display: none;
      flex-direction: column;
      gap: 12px;
    }

    audio { width: 100%; }

    .download-link {
      display: block;
      text-align: center;
      text-decoration: none;
      color: var(--primary);
      font-weight: 600;
      font-size: 0.9rem;
      padding: 8px;
      border: 1px dashed var(--primary);
      border-radius: 6px;
      background: #eef2ff;
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.min.js"></script>
</head>
<body>

<div class="container">
  <h1>村瀬亮介 音声プレイヤー (Web Test)</h1>
  <p class="sub">Style-BERT-VITS2 INT8 ブラウザ推論デモ</p>

  <div class="banner">
    <strong>⚠️ データ通信量のご注意</strong><br>
    ブラウザ上で直接音声を生成するため、初回実行時に量子化モデルデータ（約50MB）をダウンロードします。Wi-Fi環境でのご利用を推奨します。
  </div>

  <div style="font-size:0.85rem; color:#64748b; margin-bottom:6px;">再生対象テキスト:</div>
  <div class="sample-box">
    「こんにちは。村瀬亮介の音声テストプレイヤーへようこそ。ブラウザ上で動作しています。」
  </div>

  <button id="actionBtn" class="btn">モデルをロードして音声を生成</button>

  <div id="progress" class="progress-bar">
    <div id="progress-fill" class="progress-fill"></div>
  </div>

  <div id="status-text"></div>

  <div id="audio-area" class="audio-player-area">
    <audio id="audioPlayer" controls></audio>
    <a id="downloadBtn" class="download-link" href="#" download="murase_voice.wav">📥 音声ファイル (.wav) を保存</a>
  </div>
</div>

<script>
  let vitsSession = null;

  const VITS_CHUNKS = [
    './models/model_part0.bin',
    './models/model_part1.bin',
    './models/model_part2.bin'
  ];

  const btn = document.getElementById('actionBtn');
  const statusText = document.getElementById('status-text');
  const progress = document.getElementById('progress');
  const progressFill = document.getElementById('progress-fill');
  const audioArea = document.getElementById('audio-area');
  const audioPlayer = document.getElementById('audioPlayer');
  const downloadBtn = document.getElementById('downloadBtn');

  // 分割バイナリを並列取得して結合
  async function fetchAndCombineChunks(chunkUrls) {
    const buffers = await Promise.all(
      chunkUrls.map(async (url) => {
        const res = await fetch(url);
        if (!res.ok) throw new Error(`ダウンロード失敗: ${url}`);
        return await res.arrayBuffer();
      })
    );

    const totalLength = buffers.reduce((sum, buf) => sum + buf.byteLength, 0);
    const combinedArray = new Uint8Array(totalLength);
    let offset = 0;
    for (const buf of buffers) {
      combinedArray.set(new Uint8Array(buf), offset);
      offset += buf.byteLength;
    }
    return combinedArray.buffer;
  }

  // モデルの初期化
  async function loadModel() {
    progress.style.display = 'block';
    progressFill.style.width = '30%';
    statusText.textContent = '音声モデルデータを並列ダウンロード中...';

    ort.env.wasm.numThreads = navigator.hardwareConcurrency ? Math.min(4, navigator.hardwareConcurrency) : 2;

    const vitsBuffer = await fetchAndCombineChunks(VITS_CHUNKS);

    progressFill.style.width = '80%';
    statusText.textContent = 'モデルセッションを初期化中...';

    vitsSession = await ort.InferenceSession.create(vitsBuffer, {
      executionProviders: ['wasm']
    });

    progressFill.style.width = '100%';
  }

  // WAV Blob 生成 (44.1kHz)
  function createWavBlob(samples, sampleRate = 44100) {
    const buffer = new ArrayBuffer(44 + samples.length * 2);
    const view = new DataView(buffer);

    function writeString(offset, string) {
      for (let i = 0; i < string.length; i++) {
        view.setUint8(offset + i, string.charCodeAt(i));
      }
    }

    writeString(0, 'RIFF');
    view.setUint32(4, 36 + samples.length * 2, true);
    writeString(8, 'WAVE');
    writeString(12, 'fmt ');
    view.setUint32(16, 16, true);
    view.setUint16(20, 1, true);
    view.setUint16(22, 1, true);
    view.setUint32(24, sampleRate, true);
    view.setUint32(28, sampleRate * 2, true);
    view.setUint16(32, 2, true);
    view.setUint16(34, 16, true);
    writeString(36, 'data');
    view.setUint32(40, samples.length * 2, true);

    let offset = 44;
    for (let i = 0; i < samples.length; i++, offset += 2) {
      const s = Math.max(-1, Math.min(1, samples[i]));
      view.setInt16(offset, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
    }

    return new Blob([view], { type: 'audio/wav' });
  }

  // int64型を要求する既知の入力名一覧
  const INT64_INPUTS = new Set([
    'x_tst', 'x_tst_lengths', 'speakers', 'sid', 'tones', 'language', 'lang_ids'
  ]);

  btn.addEventListener('click', async () => {
    btn.disabled = true;

    try {
      if (!vitsSession) {
        await loadModel();
      }

      statusText.textContent = '特徴量データを読み込み、音声を合成中...';

      // exact_input.json の取得
      const inputRes = await fetch('./exact_input.json');
      if (!inputRes.ok) throw new Error('exact_input.json が見つかりません');
      const inputData = await inputRes.json();

      const feeds = {};
      const phoneSeqLen = inputData.x_tst ? inputData.x_tst.shape[1] : 82;

      for (const name of vitsSession.inputNames) {
        if (name in inputData) {
          const item = inputData[name];
          if (item.dtype === 'int64' || INT64_INPUTS.has(name)) {
            feeds[name] = new ort.Tensor(
              'int64',
              BigInt64Array.from(item.data.map(BigInt)),
              item.shape
            );
          } else {
            feeds[name] = new ort.Tensor(
              'float32',
              new Float32Array(item.data),
              item.shape
            );
          }
        } else {
          // 未定義入力の型別フォールバック
          if (INT64_INPUTS.has(name)) {
            const isSeq = (name === 'tones' || name === 'language' || name === 'lang_ids');
            const shape = isSeq ? [1, phoneSeqLen] : [1];
            const data = new BigInt64Array(isSeq ? phoneSeqLen : 1).fill(0n);
            feeds[name] = new ort.Tensor('int64', data, shape);
          } else {
            feeds[name] = new ort.Tensor('float32', Float32Array.from([0.0]), [1]);
          }
        }
      }

      // ONNX 推論実行
      const results = await vitsSession.run(feeds);
      const outputKey = vitsSession.outputNames[0];
      const audioData = results[outputKey].data;

      // WAV 生成 & 再生
      const sampleRate = 44100;
      const wavBlob = createWavBlob(audioData, sampleRate);
      const audioUrl = URL.createObjectURL(wavBlob);

      audioPlayer.src = audioUrl;
      downloadBtn.href = audioUrl;
      downloadBtn.download = `murase_voice_${Date.now()}.wav`;

      audioArea.style.display = 'flex';
      audioPlayer.play();
      statusText.textContent = '合成完了！';
      btn.textContent = 'もう一度音声を生成';
    } catch (err) {
      console.error(err);
      statusText.textContent = 'エラーが発生しました。コンソール(F12)をご確認ください。';
    } finally {
      btn.disabled = false;
      progress.style.display = 'none';
    }
  });
</script>

</body>
</html>
