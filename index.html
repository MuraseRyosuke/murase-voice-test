<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Style-BERT-VITS2 音声合成プレイヤー</title>
  <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.17.1/dist/ort.all.min.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      max-width: 720px;
      margin: 40px auto;
      padding: 0 20px;
      line-height: 1.6;
      color: #333;
      background-color: #fcfcfc;
    }
    h1 {
      font-size: 1.5rem;
      border-bottom: 2px solid #eaeaea;
      padding-bottom: 10px;
      margin-bottom: 16px;
    }
    .notice {
      background-color: #fffbeb;
      border-left: 4px solid #f59e0b;
      padding: 12px 16px;
      margin: 16px 0;
      font-size: 0.9rem;
      color: #92400e;
      border-radius: 0 4px 4px 0;
    }
    .notice ul {
      margin: 6px 0 0 0;
      padding-left: 20px;
    }
    .form-group {
      margin: 18px 0;
    }
    label {
      display: block;
      font-weight: 600;
      margin-bottom: 6px;
      font-size: 0.9rem;
      color: #1e293b;
    }
    select, textarea {
      width: 100%;
      box-sizing: border-box;
      padding: 10px 12px;
      border-radius: 6px;
      border: 1px solid #cbd5e1;
      font-size: 0.95rem;
      font-family: inherit;
      background-color: #fff;
    }
    textarea {
      resize: vertical;
      min-height: 60px;
      background-color: #f8fafc;
    }
    .player-card {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 16px;
      margin: 20px 0;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    audio {
      width: 100%;
      height: 40px;
    }
    .button-group {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    button {
      background-color: #2563eb;
      color: white;
      border: none;
      padding: 10px 20px;
      font-size: 0.95rem;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 500;
      transition: all 0.2s;
    }
    button:hover:not(:disabled) {
      background-color: #1d4ed8;
    }
    button:disabled {
      background-color: #93c5fd;
      cursor: not-allowed;
    }
    button.success {
      background-color: #059669;
    }
    button.success:hover:not(:disabled) {
      background-color: #047857;
    }
    #status {
      margin: 12px 0;
      font-weight: 600;
      color: #1e293b;
    }
    #log {
      background: #0f172a;
      border: 1px solid #334155;
      padding: 12px;
      border-radius: 6px;
      font-family: Consolas, Monaco, monospace;
      font-size: 0.8rem;
      white-space: pre-wrap;
      max-height: 180px;
      overflow-y: auto;
      color: #94a3b8;
    }
  </style>
</head>
<body>

  <h1>Style-BERT-VITS2 音声合成プレイヤー</h1>

  <div class="notice">
    <strong>【ご利用上の注意・前提事項】</strong>
    <ul>
      <li>ブラウザ上で直接モデル推論を行うため、初回ロードと初回生成に数十秒〜数分かかる場合があります。</li>
      <li>一度生成した音声はキャッシュされ、プレイヤーのシークバーや再生ボタンで自由に操作・リプレイできます。</li>
      <li>事前抽出されたテンソルデータ（プリセット）を選択して音声合成を実行します。</li>
    </ul>
  </div>

  <div class="form-group">
    <label for="presetSelect">発話プリセットの選択:</label>
    <select id="presetSelect" onchange="onSelectPreset()">
      <option value="exact_input.json" data-text="こんにちは。村瀬亮介の音声テストプレイヤーへようこそ。ブラウザ上で動作しています。">こんにちは。村瀬亮介の音声テストプレイヤーへようこそ。ブラウザ上で動作しています。</option>
      <option value="test_input.json" data-text="テスト音声データ (test_input.json)">テスト音声データ (test_input.json)</option>
    </select>
  </div>

  <div class="form-group">
    <label for="inputText">選択中の発話テキスト:</label>
    <textarea id="inputText" readonly>こんにちは。村瀬亮介の音声テストプレイヤーへようこそ。ブラウザ上で動作しています。</textarea>
  </div>

  <div class="button-group">
    <button id="playBtn" onclick="synthesize()">音声を合成して読み込む</button>
  </div>

  <div class="player-card">
    <label>🔊 音声プレイヤー（一時停止・シーク・音量調整）:</label>
    <audio id="audioPlayer" controls></audio>
    <div>
      <button id="downloadBtn" class="success" onclick="downloadWav()" disabled>WAVを保存</button>
    </div>
  </div>

  <div id="status">待機中</div>
  <div id="log">ログがここに表示されます...</div>

  <script>
    ort.env.wasm.numThreads = 1;
    ort.env.wasm.simd = true;

    let session = null;
    let currentBlob = null;
    const audioCache = new Map(); // プリセットごとのWAV Blobキャッシュ
    const SAMPLE_RATE = 44100;

    const audioPlayer = document.getElementById("audioPlayer");
    const downloadBtn = document.getElementById("downloadBtn");
    const playBtn = document.getElementById("playBtn");

    function log(msg) {
      console.log(msg);
      const logElem = document.getElementById("log");
      logElem.textContent += "\n" + msg;
      logElem.scrollTop = logElem.scrollHeight;
    }

    function setStatus(msg) {
      document.getElementById("status").textContent = msg;
    }

    // 起動時に models/presets.json を安全にパース
    window.addEventListener("DOMContentLoaded", async () => {
      try {
        const res = await fetch("./models/presets.json?t=" + Date.now());
        if (res.ok) {
          const data = await res.json();
          const select = document.getElementById("presetSelect");
          
          let items = [];
          if (Array.isArray(data)) {
            items = data;
          } else if (typeof data === "object" && data !== null) {
            items = Object.keys(data).map(k => ({
              file: k.endsWith(".json") ? k : `${k}.json`,
              text: typeof data[k] === "string" ? data[k] : (data[k].text || k)
            }));
          }

          if (items.length > 0) {
            select.innerHTML = "";
            items.forEach((p, idx) => {
              const opt = document.createElement("option");
              opt.value = p.file || p.json || (idx === 0 ? "exact_input.json" : `preset_${idx}.json`);
              const textContent = p.text || p.title || `プリセット ${idx + 1}`;
              opt.textContent = textContent;
              opt.dataset.text = textContent;
              select.appendChild(opt);
            });
            onSelectPreset();
            log("✓ models/presets.json からプリセットを展開しました。");
          }
        }
      } catch (e) {
        log("※ デフォルトのプリセット定義を使用します。");
      }
    });

    function onSelectPreset() {
      const select = document.getElementById("presetSelect");
      const selectedOpt = select.options[select.selectedIndex];
      if (!selectedOpt) return;

      const text = selectedOpt.dataset.text || selectedOpt.textContent;
      document.getElementById("inputText").value = text;
      
      const jsonFile = selectedOpt.value;
      if (audioCache.has(jsonFile)) {
        setPlayerSource(audioCache.get(jsonFile));
        setStatus("生成済みの音声がプレイヤーに読み込まれました（即座に再生可能）");
      }
    }

    function setPlayerSource(blob) {
      currentBlob = blob;
      const url = URL.createObjectURL(blob);
      audioPlayer.src = url;
      downloadBtn.disabled = false;
    }

    // 分割モデルの自動結合ロード
    async function loadModel() {
      setStatus("モデルファイル (models/model_part*.bin) を探索・読み込み中...");
      const chunks = [];
      let idx = 0;
      
      while (true) {
        const partPath = `./models/model_part${idx}.bin`;
        try {
          const res = await fetch(partPath);
          if (!res.ok) {
            if (idx === 0) throw new Error(`${partPath} が見つかりません。`);
            break;
          }
          const buf = await res.arrayBuffer();
          chunks.push(new Uint8Array(buf));
          log(`✓ チャンク読み込み: model_part${idx}.bin (${(buf.byteLength / 1024 / 1024).toFixed(1)} MB)`);
          idx++;
        } catch (e) {
          if (idx === 0) throw e;
          break;
        }
      }

      log(`合計 ${chunks.length} 個のチャンクを結合中...`);
      const totalLength = chunks.reduce((acc, c) => acc + c.length, 0);
      const merged = new Uint8Array(totalLength);
      let offset = 0;
      for (const chunk of chunks) {
        merged.set(chunk, offset);
        offset += chunk.length;
      }

      log(`ONNX Runtime セッションを初期化中 (${(totalLength / 1024 / 1024).toFixed(1)} MB)...`);
      session = await ort.InferenceSession.create(merged.buffer, {
        executionProviders: ['wasm']
      });
      log("✅ モデルのロードが完了しました。");
    }

    // 音声合成処理
    async function synthesize() {
      const select = document.getElementById("presetSelect");
      const jsonFile = select.value || "exact_input.json";

      // キャッシュがある場合は即座に再生
      if (audioCache.has(jsonFile)) {
        log(`⚡ キャッシュからプレイヤーへセット: ${jsonFile}`);
        setPlayerSource(audioCache.get(jsonFile));
        audioPlayer.play();
        setStatus("再生中 🔊");
        return;
      }

      playBtn.disabled = true;
      downloadBtn.disabled = true;

      try {
        if (!session) {
          await loadModel();
        }

        setStatus(`入力データ (${jsonFile}) を読み込み中...`);
        const res = await fetch(`./${jsonFile}?t=` + Date.now());
        if (!res.ok) throw new Error(`${jsonFile} が見つかりません。`);
        const payload = await res.json();

        // 低ノイズ化パラメータの適用
        if (payload.noise_scale) payload.noise_scale.data = [0.35];
        if (payload.noise_scale_w) payload.noise_scale_w.data = [0.6];
        if (payload.sdp_ratio) payload.sdp_ratio.data = [0.0];

        const feeds = {};
        const aliasMap = { x_tst: "x", x_tst_lengths: "x_lengths", speakers: "sid", tones: "tone" };

        for (const inputName of session.inputNames) {
          let sourceKey = inputName;
          if (!payload[sourceKey]) {
            sourceKey = Object.keys(aliasMap).find(k => aliasMap[k] === inputName || k === inputName) || inputName;
          }

          const item = payload[sourceKey] || payload[aliasMap[sourceKey]];
          if (item) {
            let shape = [...item.shape];
            if (inputName.includes("style") && shape.length === 2) {
              shape = [1, 1, 256];
            }

            if (item.dtype === "int64") {
              const bigArr = new BigInt64Array(item.data.map(v => BigInt(v)));
              feeds[inputName] = new ort.Tensor("int64", bigArr, shape);
            } else {
              const f32Arr = new Float32Array(item.data);
              feeds[inputName] = new ort.Tensor("float32", f32Arr, shape);
            }
          }
        }

        setStatus("音声合成中（ブラウザ上で推論を実行しています）...");
        const tStart = performance.now();
        const results = await session.run(feeds);
        const tInfer = ((performance.now() - tStart) / 1000).toFixed(2);
        log(`推論完了: ${tInfer} 秒`);

        const outputName = session.outputNames[0];
        const audioData = results[outputName].data; // Float32Array

        // WAV Blob に変換してキャッシュ & プレイヤーにセット
        const wavBlob = encodeWAV(audioData, SAMPLE_RATE);
        audioCache.set(jsonFile, wavBlob);
        setPlayerSource(wavBlob);

        // 自動再生
        audioPlayer.play();

        setStatus("再生中 🔊");
        log("✅ 音声をプレイヤーに読み込みました。");
      } catch (err) {
        setStatus("エラーが発生しました");
        log("❌ " + err.message);
        console.error(err);
      } finally {
        playBtn.disabled = false;
      }
    }

    // WAV ダウンロード
    function downloadWav() {
      if (!currentBlob) return;
      const url = URL.createObjectURL(currentBlob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `voice_${Date.now()}.wav`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      log("💾 WAVファイルを保存しました。");
    }

    // Float32Array -> 16-bit PCM WAV Blob 変換
    function encodeWAV(samples, sampleRate) {
      const buffer = new ArrayBuffer(44 + samples.length * 2);
      const view = new DataView(buffer);

      function writeString(view, offset, string) {
        for (let i = 0; i < string.length; i++) {
          view.setUint8(offset + i, string.charCodeAt(i));
        }
      }

      writeString(view, 0, 'RIFF');
      view.setUint32(4, 36 + samples.length * 2, true);
      writeString(view, 8, 'WAVE');
      writeString(view, 12, 'fmt ');
      view.setUint32(16, 16, true);
      view.setUint16(20, 1, true);
      view.setUint16(22, 1, true);
      view.setUint32(24, sampleRate, true);
      view.setUint32(28, sampleRate * 2, true);
      view.setUint16(32, 2, true);
      view.setUint16(34, 16, true);
      writeString(view, 36, 'data');
      view.setUint32(40, samples.length * 2, true);

      let offset = 44;
      for (let i = 0; i < samples.length; i++, offset += 2) {
        let s = Math.max(-1, Math.min(1, samples[i]));
        view.setInt16(offset, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
      }

      return new Blob([view], { type: 'audio/wav' });
    }
  </script>
</body>
</html>
